<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Painel Administrativo — Coisas de Clarice</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🦋%3C/text%3E%3C/svg%3E" />

  <!-- Fontes da marca -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- =========================================================
       CSS CUSTOMIZADO — ABORDAGEM MINIMALISTA
       
       Princípio: NÃO mexer no header do Decap, NÃO forçar
       cores em botões nativos. Só customizar o que é SEGURO
       (fontes, sidebar, cards, inputs, loading).
       
       Lição aprendida: tentar pintar o header do Decap de claro
       causa texto branco invisível em botões nativos. Deixar o
       estilo original do header.
       ========================================================= -->
  <style>
    :root {
      --marca-rosa: #F472B6;
      --marca-rosa-claro: #FDE8F0;
      --marca-rosa-claro-fundo: #FDF4F8;
      --marca-marinho: #3B3F8C;
      --marca-cinza: #6B7280;
    }

    /* ---- Tipografia da marca (seguro: não afeta cores) ---- */
    body, html {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif !important;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3 {
      font-family: 'Playfair Display', serif !important;
    }

    /* ---- Sidebar (lateral esquerda com Coleções) ---- */
    /* Só pintamos o item ATIVO. Não mexemos no fundo da sidebar. */
    [class*="CollectionLink"][class*="active"],
    [class*="SidebarNavLink"][class*="active"],
    [class*="NavLink"][class*="active"] {
      background: var(--marca-rosa-claro-fundo) !important;
      color: #DB2777 !important;
      border-left: 3px solid var(--marca-rosa) !important;
      font-weight: 600 !important;
    }

    /* ---- Cards de entradas (lista de produtos/categorias) ---- */
    /* Hover sutil nos cards. Não mexe no fundo. */
    [class*="EntryListing"] a:hover,
    [class*="CardTable"] a:hover,
    article[class*="Entry"]:hover {
      border-color: var(--marca-rosa) !important;
      box-shadow: 0 4px 12px -4px rgba(244, 114, 182, 0.25) !important;
      transition: all 200ms ease !important;
    }

    /* ---- Focus rosa nos inputs ---- */
    [class*="ControlPane"] input[type="text"]:focus,
    [class*="ControlPane"] textarea:focus,
    [class*="ControlPane"] [contenteditable="true"]:focus {
      border-color: var(--marca-rosa) !important;
      box-shadow: 0 0 0 3px rgba(244, 114, 182, 0.15) !important;
      outline: none !important;
    }

    /* ---- Scrollbar rosa ---- */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: #FDF4F8; }
    ::-webkit-scrollbar-thumb { background: #F9A8D4; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #F472B6; }

    /* ---- Loading inicial (antes do Decap carregar) ---- */
    #nc-root:empty::before {
      content: '🦋';
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 48px;
      animation: borboletaPulso 1.5s ease-in-out infinite;
    }
    @keyframes borboletaPulso {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
      50% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
    }

    /* ---- Preview de imagens com borda rosa ---- */
    [class*="ImageAsset"] img,
    [class*="FileAsset"] [class*="Preview"] img {
      border-radius: 8px !important;
      border: 1px solid var(--marca-rosa-claro) !important;
    }
  </style>
</head>
<body>
  <!-- Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.5.0/dist/decap-cms.js"></script>
</body>
</html>

# ============================================
# Decap CMS - Configuração
# Painel Administrativo - Coisas de Clarice
# ============================================

# Backend: onde os dados são salvos
# OAuth gerenciado pelo Cloudflare Worker próprio
backend:
  name: github
  repo: MasterSS2011/coisas-de-clarice
  branch: main
  base_url: https://decap-oauth-coisasdeclarice.mastercompany2011.workers.dev
  auth_endpoint: /auth

# Nome exibido no painel
site_url: https://coisasdeclarice.com.br
display_url: https://coisasdeclarice.com.br
logo_url: https://coisasdeclarice.com.br/imagens/logocec.png

# Pasta onde imagens enviadas pelo painel serão salvas
media_folder: "imagens/painel"
public_folder: "/imagens/painel"

# Idioma do painel (parcial em português)
locale: 'pt'

# ============================================
# COLEÇÕES = tipos de conteúdo editável
# ============================================
collections:

  # ---- COLEÇÃO 1: Configurações gerais do site ----
  - name: "configuracoes"
    label: "⚙️ Configurações Gerais"
    description: "Dados principais do site: WhatsApp, redes sociais, textos"
    editor:
      preview: false
    files:
      - name: "site"
        label: "Dados do Site"
        file: "conteudo/configuracoes.json"
        fields:
          - { name: "whatsapp", label: "WhatsApp (apenas números com DDD)", widget: "string", default: "5548991218191" }
          - { name: "email", label: "E-mail profissional", widget: "string", default: "contato@coisasdeclarice.com.br" }
          - { name: "instagram", label: "Link do Instagram", widget: "string", required: false, default: "" }
          - { name: "mensagem_whatsapp", label: "Mensagem padrão do WhatsApp", widget: "text", default: "Olá! Vim pelo site e gostaria de mais informações." }

  # ---- COLEÇÃO 2: Textos da página inicial ----
  - name: "home"
    label: "🏠 Textos da Página Inicial"
    description: "Edite os textos principais da home"
    editor:
      preview: false
    files:
      - name: "hero"
        label: "Seção Principal (Hero)"
        file: "conteudo/home-hero.json"
        fields:
          - { name: "titulo", label: "Título principal", widget: "string", default: "Papelaria que conta a sua história" }
          - { name: "subtitulo", label: "Subtítulo", widget: "text", default: "Convites, lembrancinhas e detalhes feitos com amor — enviamos para todo o Brasil." }
          - { name: "cta_catalogo", label: "Texto do botão Catálogo", widget: "string", default: "Ver Catálogo" }
          - { name: "cta_whatsapp", label: "Texto do botão WhatsApp", widget: "string", default: "Falar no WhatsApp" }

  # ---- COLEÇÃO 3: Campanhas Sazonais (EXPANDIDA — FASE E) ----
  - name: "campanhas"
    label: "🎉 Campanhas Sazonais"
    description: "Ative campanhas (Natal, Páscoa, Dia das Mães...) com banner, hero adaptado e produtos em destaque"
    editor:
      preview: false
    files:
      - name: "campanha_ativa"
        label: "Campanha Atual"
        file: "conteudo/campanha-ativa.json"
        fields:

          # ==== CONFIGURAÇÕES GERAIS ====
          - name: "ativa"
            label: "Campanha ativa?"
            widget: "boolean"
            default: false
            hint: "Desmarque para desativar sem precisar apagar nada"

          - name: "nome"
            label: "Nome da campanha"
            widget: "string"
            default: "Natal 2026"
            hint: "Ex: Natal 2026, Dia das Mães, Páscoa"

          - name: "cor_destaque"
            label: "Cor de destaque (código HEX)"
            widget: "string"
            default: "#0F766E"
            pattern: ['^#[0-9A-Fa-f]{6}$', "Formato: #RRGGBB (ex: #0F766E)"]
            hint: "Padrão rosa: #F472B6. Verde Natal: #0F766E. Vermelho: #DC2626. Dourado: #CA8A04"

          - name: "data_inicio"
            label: "Data de início (opcional)"
            widget: "datetime"
            required: false
            format: "YYYY-MM-DD"
            date_format: "DD/MM/YYYY"
            time_format: false
            picker_utc: false
            hint: "Deixe vazio para começar imediatamente. Permite agendar lançamentos futuros."

          - name: "data_fim"
            label: "Data de término (opcional)"
            widget: "datetime"
            required: false
            format: "YYYY-MM-DD"
            date_format: "DD/MM/YYYY"
            time_format: false
            picker_utc: false
            hint: "Após esta data, a campanha some sozinha. Deixe vazio para não expirar."

          # ==== BANNER NO TOPO ====
          - name: "banner_texto"
            label: "📢 Texto do banner (topo do site)"
            widget: "string"
            required: false
            default: ""
            hint: "Ex: 🎄 Peça até 20/12 e garanta a entrega até o Natal! Deixe vazio para NÃO exibir banner."

          # ==== HERO ADAPTADO ====
          - name: "imagem_hero"
            label: "🖼️ Imagem da campanha (dentro de moldura redonda)"
            widget: "image"
            required: false
            hint: "A imagem é exibida INTEIRA (nada é cortado) dentro de uma moldura redonda com fundo branco. Qualquer proporção funciona — vertical, horizontal ou quadrada. Flyers com textos ficam totalmente legíveis."

          - name: "video_hero"
            label: "🎥 Vídeo da campanha (opcional, até 15s / 5MB)"
            widget: "file"
            required: false
            media_library:
              config:
                multiple: false
            hint: "MP4 vertical 9:16 (formato de celular). Abre em POPUP ao clicar na imagem acima. Comprima vídeos longos antes de subir (apps: InShot, CapCut)."

          - name: "chamada_hero"
            label: "💬 Chamada abaixo da imagem (opcional)"
            widget: "string"
            required: false
            default: ""
            hint: "Frase curta chamativa que aparece abaixo do nome da campanha. Ex: Peça já suas bolinhas de Natal personalizadas!"

          # ==== DESTAQUES ====
          - name: "destaques"
            label: "🎁 Produtos em destaque (até 6)"
            widget: "list"
            required: false
            max: 6
            min: 0
            summary: "{{fields.nome}}"
            hint: "Produtos especiais da campanha. Aparecem numa seção dedicada entre Categorias e Galeria. Deixe vazio para não mostrar a seção."
            fields:
              - { name: "foto", label: "Foto do produto", widget: "image" }
              - { name: "nome", label: "Nome do produto", widget: "string" }
              - { name: "descricao", label: "Descrição curta", widget: "text", hint: "Até 2-3 linhas" }
              - { name: "mensagem_whatsapp", label: "Mensagem personalizada do WhatsApp", widget: "text", hint: "Ex: Olá! Tenho interesse na Caixa Especial de Natal!" }

  # ---- COLEÇÃO 4: Categorias do Catálogo (Fase F) ----
  - name: "categorias"
    label: "📁 Categorias do Catálogo"
    description: "Gerencie as categorias que organizam os produtos no catálogo. Mudanças aqui refletem nos filtros do site."
    folder: "conteudo/categorias"
    create: true
    slug: "{{slug}}"
    extension: "json"
    format: "json"
    editor:
      preview: false
    identifier_field: "nome"
    summary: "{{nome}} ({{icone}}) — ordem {{ordem}}"
    fields:
      - name: "nome"
        label: "Nome da categoria"
        widget: "string"
        hint: "⚠️ Se renomear uma categoria existente, os produtos que a usam ficam SEM categoria. Reatribua produtos depois."

      - name: "icone"
        label: "Ícone da categoria"
        widget: "select"
        default: "tag"
        options:
          - { label: "✉️ Envelope (convites)", value: "mail" }
          - { label: "🎁 Presente (lembrancinhas)", value: "gift" }
          - { label: "🎂 Bolo (topo de bolo)", value: "cake" }
          - { label: "🎉 Festa (itens de festa)", value: "party-popper" }
          - { label: "📦 Caixa (kits)", value: "package" }
          - { label: "✨ Brilho", value: "sparkles" }
          - { label: "💝 Coração (datas especiais)", value: "heart" }
          - { label: "⭐ Estrela (destaques)", value: "star" }
          - { label: "🏷️ Etiqueta (genérico)", value: "tag" }
          - { label: "🛍️ Sacola (comercial)", value: "shopping-bag" }
          - { label: "🌸 Flor", value: "flower" }
          - { label: "🎀 Fita", value: "ribbon" }

      - name: "ordem"
        label: "Ordem de exibição (menor aparece primeiro)"
        widget: "number"
        default: 99
        value_type: "int"
        min: 1
        hint: "Use 1, 2, 3... Categorias com ordem menor aparecem primeiro nos filtros."

  # ---- COLEÇÃO 5: Produtos do Catálogo (Fase F) ----
  - name: "produtos"
    label: "📦 Produtos do Catálogo"
    description: "Gerencie os produtos exibidos no catálogo. Mais recentes aparecem primeiro no site."
    folder: "conteudo/produtos"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "json"
    format: "json"
    editor:
      preview: false
    identifier_field: "nome"
    summary: "{{nome}} — {{categoria}} ({{preco_display}})"
    sortable_fields: ["nome", "categoria", "ativo"]
    fields:
      - name: "nome"
        label: "Nome do produto"
        widget: "string"

      - name: "categoria"
        label: "Categoria"
        widget: "relation"
        collection: "categorias"
        search_fields: ["nome"]
        value_field: "nome"
        display_fields: ["nome"]
        hint: "Escolha de uma lista de categorias existentes. Para adicionar nova, cadastre em 📁 Categorias."

      - name: "preco"
        label: "Preço (apenas o valor, ex: 25,00)"
        widget: "string"
        required: false
        hint: "Deixe vazio para mostrar como 'Sob consulta'."

      - name: "preco_display"
        label: "Prefixo do preço (ex: 'A partir de ')"
        widget: "string"
        default: "A partir de R$ "
        required: false
        hint: "Texto que aparece ANTES do valor. Ex: 'A partir de R$ ' → mostra 'A partir de R$ 25,00'. Deixe só 'R$ ' para mostrar sem prefixo."

      - name: "descricao"
        label: "Descrição curta (opcional)"
        widget: "text"
        required: false
        hint: "1 a 2 linhas. Deixe vazio para não exibir."

      - name: "fotos"
        label: "Fotos do produto (até 15)"
        widget: "list"
        max: 15
        min: 1
        hint: "Ideal entre 3 e 5 fotos. Aparecem em carrossel no site. A primeira foto é a principal."
        field:
          name: "imagem"
          label: "Foto"
          widget: "image"

      - name: "mensagem_whatsapp"
        label: "Mensagem personalizada para WhatsApp"
        widget: "text"
        hint: "Texto que vai pré-preenchido quando o cliente clicar em 'Pedir Orçamento'. Ex: Olá! Tenho interesse no produto X. Gostaria de mais informações."

      - name: "destaque"
        label: "⭐ Produto em destaque?"
        widget: "boolean"
        default: false
        hint: "Produtos marcados como destaque recebem um selo visual no card."

      - name: "ativo"
        label: "✅ Produto ativo (visível no site)?"
        widget: "boolean"
        default: true
        hint: "Desmarque para OCULTAR o produto do site sem precisar apagar."
